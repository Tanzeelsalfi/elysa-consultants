<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin Login — Elysa Consultants</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="/static/css/admin.css" />
</head>
<body class="admin-login-body">

  <div class="login-page">
    <div class="login-card">

      <div class="login-logo">
        <i class="fas fa-shield-alt"></i>
      </div>

      <h1>Admin Access</h1>
      <p class="login-subtitle">Elysa Consultants Dashboard</p>

      <form id="loginForm" novalidate>

        <div class="login-form-group">
          <label for="admin-username">
            <i class="fas fa-user"></i> Username
          </label>
          <input
            type="text"
            id="admin-username"
            name="username"
            placeholder="Enter username"
            autocomplete="username"
            required
          />
        </div>

        <div class="login-form-group">
          <label for="admin-password">
            <i class="fas fa-lock"></i> Password
          </label>
          <div class="password-wrap">
            <input
              type="password"
              id="admin-password"
              name="password"
              placeholder="Enter password"
              autocomplete="current-password"
              required
            />
            <button type="button" class="toggle-pw" id="togglePw" aria-label="Toggle password visibility">
              <i class="fas fa-eye" id="pwIcon"></i>
            </button>
          </div>
        </div>

        <div class="login-error" id="loginError" style="display:none;">
          <i class="fas fa-exclamation-circle"></i>
          <span id="loginErrorText">Invalid credentials.</span>
        </div>

        <button type="submit" class="btn-login" id="loginBtn">
          <span id="loginBtnText"><i class="fas fa-sign-in-alt"></i> Login</span>
          <span id="loginBtnLoad" style="display:none;"><i class="fas fa-spinner fa-spin"></i> Logging in...</span>
        </button>

      </form>

      <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Back to Website</a>

    </div>
  </div>

  <script src="/static/js/admin.js"></script>
</body>
</html>
